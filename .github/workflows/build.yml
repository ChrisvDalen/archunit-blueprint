name: Build

on:
  push:
    branches: [ main, "agent/**", "claude/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Test and build plugin
        run: ./gradlew test buildPlugin --no-daemon --info --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload plugin artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: archunit-rule-generator-${{ github.sha }}
          path: build/distributions/*.zip
          retention-days: 30
